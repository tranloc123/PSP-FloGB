name: Build PSP Live FloGB V0.3 Inspector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PSP Live FloGB V0.3 Inspector APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python icon tooling
        run: |
          python3 -m pip install --disable-pip-version-check pillow

      - name: Clone pinned PPSSPP source
        run: |
          git clone https://github.com/hrydgard/ppsspp.git ppsspp
          cd ppsspp
          git checkout 03bb3e20fed8cbea4901c774a3245bc3fc2c0de0
          git submodule update --init --recursive

      - name: Apply PSP Live FloGB V0.3 patch
        run: |
          python3 tools/apply_psp_live_flogb_v0_3.py \
            ppsspp \
            branding/PSP_Live_FloGB_icon_source.png

      - name: Verify V0.3 patch
        run: |
          echo "=== APP ==="
          grep -n 'app_name' ppsspp/android/res/values/strings.xml
          grep -n 'applicationId' ppsspp/android/build.gradle.kts | head -n 10

          echo "=== SCBD MODULES ==="
          test -f ppsspp/SCBD/SCBDViewer.h
          test -f ppsspp/SCBD/SCBDMemoryInspector.h
          grep -n 'P1Only' ppsspp/SCBD/SCBDMemoryInspector.h
          grep -n 'ProcessPending' ppsspp/SCBD/SCBDMemoryInspector.h

          echo "=== HUD / UI HOOKS ==="
          grep -n 'DrawSCBDOverlay' ppsspp/UI/DebugOverlay.cpp ppsspp/UI/EmuScreen.cpp
          grep -n 'P1ONLY' ppsspp/UI/EmuScreen.cpp
          grep -n 'PIN +/-' ppsspp/UI/EmuScreen.cpp

          echo "=== BUILD INFO ==="
          cat ppsspp/PSP_LIVE_FLOGB_BUILD_INFO.txt

      - name: Build NormalOptimized APK
        working-directory: ppsspp
        run: |
          chmod +x gradlew
          ./gradlew assembleNormalOptimized --stacktrace

      - name: Collect APK
        run: |
          echo "=== APK files ==="
          find ppsspp/android/build -type f -name "*.apk" -print

          mkdir -p artifacts
          APK="$(find ppsspp/android/build -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced."
            exit 1
          fi

          cp "$APK" artifacts/PSP_Live_FloGB_V0_3_Inspector.apk
          ls -lh artifacts/PSP_Live_FloGB_V0_3_Inspector.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PSP-Live-FloGB-V0.3-Inspector-APK
          path: artifacts/PSP_Live_FloGB_V0_3_Inspector.apk
          if-no-files-found: error
