name: Build PSP Live FloGB V0.4 Bone Mapper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PSP Live FloGB V0.4 Bone Mapper APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python icon tooling
        run: |
          python3 -m pip install --disable-pip-version-check pillow

      - name: Clone pinned PPSSPP source
        run: |
          git clone https://github.com/hrydgard/ppsspp.git ppsspp
          cd ppsspp
          git checkout 03bb3e20fed8cbea4901c774a3245bc3fc2c0de0
          git submodule update --init --recursive

      - name: Apply preserved V0.3 patch
        run: |
          python3 tools/apply_psp_live_flogb_v0_3.py \
            ppsspp \
            branding/PSP_Live_FloGB_icon_source.png

      - name: Apply V0.4 Bone Mapper patch
        run: |
          python3 tools/apply_psp_live_flogb_v0_4.py ppsspp

      - name: Verify V0.4 patch
        run: |
          echo "=== V0.3 PRESERVED ==="
          test -f ppsspp/SCBD/SCBDViewer.h
          test -f ppsspp/SCBD/SCBDMemoryInspector.h
          grep -n 'P1Only' ppsspp/SCBD/SCBDMemoryInspector.h

          echo "=== V0.4 BONE MAPPER ==="
          test -f ppsspp/SCBD/SCBDBoneMapper.h
          grep -n 'kP1FighterPtrAddress' ppsspp/SCBD/SCBDBoneMapper.h
          grep -n 'kP2FighterPtrAddress' ppsspp/SCBD/SCBDBoneMapper.h
          grep -n 'kBoneArrayPtrOffset' ppsspp/SCBD/SCBDBoneMapper.h
          grep -n 'CaptureCamera' ppsspp/GPU/GPUCommonHW.cpp
          grep -n 'DrawSCBDBoneMapper' ppsspp/UI/DebugOverlay.cpp

          echo "=== BUILD INFO ==="
          cat ppsspp/PSP_LIVE_FLOGB_BUILD_INFO.txt

      - name: Build NormalOptimized APK
        working-directory: ppsspp
        run: |
          chmod +x gradlew
          ./gradlew assembleNormalOptimized --stacktrace

      - name: Collect APK
        run: |
          echo "=== APK files ==="
          find ppsspp/android/build -type f -name "*.apk" -print

          mkdir -p artifacts
          APK="$(find ppsspp/android/build -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced."
            exit 1
          fi

          cp "$APK" artifacts/PSP_Live_FloGB_V0_4_BoneMapper.apk
          ls -lh artifacts/PSP_Live_FloGB_V0_4_BoneMapper.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PSP-Live-FloGB-V0.4-BoneMapper-APK
          path: artifacts/PSP_Live_FloGB_V0_4_BoneMapper.apk
          if-no-files-found: error
