name: Build SCBD Viewer Emulator V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone PPSSPP upstream with submodules
        run: |
          git clone --recurse-submodules https://github.com/hrydgard/ppsspp.git ppsspp
          cd ppsspp
          git submodule update --init --recursive

      - name: Apply SCBD Viewer Emulator V0.1 patch
        run: |
          python3 tools/apply_scbd_patch.py ppsspp

      - name: Verify SCBD patch
        run: |
          echo "=== Android applicationId ==="
          grep -n 'applicationId' ppsspp/android/build.gradle.kts | head -n 10

          echo "=== Android app name ==="
          cat ppsspp/android/res/values/strings.xml

          echo "=== Native app name ==="
          grep -n 'SCBD Viewer Emulator' ppsspp/UI/NativeApp.cpp

          echo "=== SCBD module ==="
          cat ppsspp/SCBD/SCBDViewer.h

      - name: Build NormalOptimized APK
        working-directory: ppsspp
        run: |
          chmod +x gradlew
          ./gradlew assembleNormalOptimized --stacktrace

      - name: Collect APK
        run: |
          echo "=== APK files found ==="
          find ppsspp -type f -name "*.apk" -print

          mkdir -p artifacts

          APK="$(find ppsspp/android/build -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          cp "$APK" artifacts/SCBD_Viewer_Emulator_V0_1.apk

          echo "=== Final artifact ==="
          ls -lh artifacts/SCBD_Viewer_Emulator_V0_1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SCBD-Viewer-Emulator-V0.1-APK
          path: artifacts/SCBD_Viewer_Emulator_V0_1.apk
          if-no-files-found: error
