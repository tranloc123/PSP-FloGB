name: Build SCBD Viewer Emulator APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Clone PPSSPP upstream with submodules
        run: |
          git clone --recurse-submodules https://github.com/hrydgard/ppsspp.git ppsspp
          cd ppsspp
          git submodule update --init --recursive

      - name: Apply SCBD Viewer Emulator V0.1 patch
        run: |
          python3 tools/apply_scbd_patch.py ppsspp

      - name: Show patched identity
        run: |
          grep -n 'applicationId' ppsspp/android/build.gradle.kts | head
          cat ppsspp/android/res/values/strings.xml
          grep -n 'SCBD Viewer Emulator' ppsspp/UI/NativeApp.cpp

      - name: Build NormalOptimized APK
        working-directory: ppsspp
        run: |
          chmod +x gradlew
          ./gradlew assembleNormalOptimized --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find ppsspp/android/build -type f -name "*.apk" -print
          APK="$(find ppsspp/android/build -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/SCBD_Viewer_Emulator_V0_1.apk
          test -f artifacts/SCBD_Viewer_Emulator_V0_1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SCBD-Viewer-Emulator-V0.1-APK
          path: artifacts/SCBD_Viewer_Emulator_V0_1.apk
          if-no-files-found: error
